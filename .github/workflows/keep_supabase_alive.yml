name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC to prevent Supabase free tier auto-pause (7-day threshold)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          curl -s -X GET "$SUPABASE_URL/rest/v1/properties?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            > /dev/null
          echo "Supabase successfully pinged."
